<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>SourceTX Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--navy:#0A1B31;--navy-2:#10233F;--teal:#14C8B5;--violet:#7B5CFF;--ink:#1A2433;--muted:#64748B;--line:#E5EAF0;--bg:#F4F6FA;--card:#FFFFFF;--danger:#E5484D;--ok:#16A34A}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
    header{background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 60%,#1A1B4B 100%);color:#fff;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
    header .brand{font-weight:800;letter-spacing:.2px}
    header .brand span{color:var(--teal)}
    header a{color:#fff;text-decoration:none;font-size:13px;opacity:.9}
    .wrap{max-width:1180px;margin:0 auto;padding:24px}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
    .tab{background:#fff;border:1px solid var(--line);color:var(--muted);padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
    .tab.active{background:linear-gradient(120deg,var(--teal),var(--violet));color:#fff;border-color:transparent}
    .tab .badge{display:inline-block;margin-left:6px;background:rgba(0,0,0,.12);border-radius:20px;padding:0 7px;font-size:12px}
    .tab.active .badge{background:rgba(255,255,255,.25)}
    .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
    input[type=search],input[type=text],input[type=email],select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
    input[type=search]{flex:1;min-width:200px}
    .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
    .btn.primary{background:linear-gradient(120deg,var(--teal),var(--violet));color:#fff;border:none}
    .btn.small{padding:5px 10px;font-size:13px}
    .btn:hover{opacity:.9}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
    .panel.unread{border-left:4px solid var(--violet);background:#FBFAFF}
    .panel .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
    .panel .who{font-weight:700}
    .panel .meta{color:var(--muted);font-size:13px;margin-top:2px}
    .panel .body{margin-top:10px;white-space:pre-wrap}
    .panel .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
    .chip{display:inline-block;background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
    .dot.unread{background:var(--violet)}
    .dot.read{background:#C6CDD8}
    .empty{color:var(--muted);text-align:center;padding:30px;font-size:14px}
    .tag{font-size:12px;padding:2px 9px;border-radius:6px;font-weight:600}
    .tag.on{background:#E6F7EE;color:var(--ok)}
    .tag.off{background:#FDECEC;color:var(--danger)}
    table.jobs{width:100%;border-collapse:collapse}
    table.jobs th,table.jobs td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
    table.jobs th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
    .replies{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
    .replies .reply{background:var(--bg);border-radius:8px;padding:10px;margin-top:8px;font-size:13px}
    .replies .reply .rhead{color:var(--muted);font-size:12px;margin-bottom:4px}
    .modal{position:fixed;inset:0;background:rgba(10,27,49,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
    .modal.open{display:flex}
    .modal .card{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:22px;max-height:90vh;overflow:auto}
    .modal h2{margin:0 0 16px;font-size:18px}
    .modal label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}
    .modal input,.modal select,.modal textarea{width:100%}
    .modal .row{display:flex;gap:10px;flex-wrap:wrap}
    .modal .row>div{flex:1;min-width:150px}
    .modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
    .status{font-size:13px;margin-top:10px}
    .status.err{color:var(--danger)}
    .status.ok{color:var(--ok)}
    .array-input{display:flex;flex-direction:column;gap:6px}
    .array-input input{margin-bottom:2px}
    .kv{color:var(--muted);font-size:13px}
    .muted{color:var(--muted)}
    .hint{font-size:12px;color:var(--muted);margin:4px 0}
    .hint code{background:#EEF2F7;padding:1px 5px;border-radius:4px;font-size:11px}
    #im-file{margin-top:10px}
    .toast{position:fixed;bottom:22px;right:22px;background:#101B2B;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transform:translateY(8px);transition:.25s}
    .toast.show{opacity:1;transform:none}
    .toast.err{background:#B42318}
    @media(max-width:600px){header .brand{font-size:15px}.wrap{padding:14px}}
  </style>
</head>
<body>
<header>
  <div class="brand">SourceTX <span>Admin</span></div>
  <a href="/">View Website</a>
</header>
<main class="wrap">
  <nav class="tabs" id="tabs"></nav>
  <section id="view"></section>
</main>

<div class="modal" id="modal">
  <div class="card" id="modalCard"></div>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
