<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t d"><title id="t">Animated cybersecurity illustration</title><desc id="d">A protective security shield monitors connected applications, devices, identities, and cloud systems.</desc><style>.bg{fill:#07192d}.orbit{fill:none;stroke:#28536e;stroke-width:2;stroke-dasharray:7 9;animation:spin 20s linear infinite;transform-origin:360px 260px}.shield{fill:#078fb9;stroke:#78b93f;stroke-width:7}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-origin:360px 260px}.node{fill:#102f49;stroke:#3b88a8;stroke-width:3}.txt{font:700 17px Arial,sans-serif;fill:white;text-anchor:middle}.small{font:600 13px Arial,sans-serif;fill:#bad2df;text-anchor:middle}.scan{fill:none;stroke:#fff;stroke-width:4;opacity:.7;animation:scan 3s ease-in-out infinite}.dot{fill:#78b93f;animation:blink 1.5s infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.05)}}@keyframes scan{0%,100%{transform:translateY(-18px);opacity:.2}50%{transform:translateY(55px);opacity:.9}}@keyframes blink{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="bg" width="720" height="520" rx="30"/><circle class="orbit" cx="360" cy="260" r="195"/><g class="pulse"><path class="shield" d="M360 112l125 48v89c0 83-47 137-125 168-78-31-125-85-125-168v-89z"/><path d="M319 257l28 28 59-67" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path class="scan" d="M275 203h170"/></g><g><rect class="node" x="60" y="106" width="145" height="78" rx="18"/><text class="txt" x="132" y="139">Identity</text><text class="small" x="132" y="163">IAM &amp; zero trust</text><rect class="node" x="515" y="106" width="145" height="78" rx="18"/><text class="txt" x="587" y="139">Cloud</text><text class="small" x="587" y="163">Posture &amp; controls</text><rect class="node" x="60" y="336" width="145" height="78" rx="18"/><text class="txt" x="132" y="369">Applications</text><text class="small" x="132" y="393">Secure SDLC</text><rect class="node" x="515" y="336" width="145" height="78" rx="18"/><text class="txt" x="587" y="369">Operations</text><text class="small" x="587" y="393">Detect &amp; respond</text></g><circle class="dot" cx="235" cy="163" r="7"/><circle class="dot" cx="485" cy="163" r="7"/><circle class="dot" cx="235" cy="369" r="7"/><circle class="dot" cx="485" cy="369" r="7"/></svg>