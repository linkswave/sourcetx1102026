<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t d"><title id="t">Animated talent network illustration</title><desc id="d">Candidate profiles connect to a SourceTX recruiting hub and client teams.</desc><style>.bg{fill:#eaf6fa}.line{stroke:#76a2b7;stroke-width:3;stroke-dasharray:8 9;animation:dash 4s linear infinite}.person{fill:#fff;stroke:#078fb9;stroke-width:3}.green{stroke:#78b93f}.hub{fill:#07192d}.float{animation:float 4s ease-in-out infinite}.f2{animation-delay:.7s}.f3{animation-delay:1.4s}.pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:360px 260px}.txt{font:700 17px Arial,sans-serif;fill:#10243b;text-anchor:middle}.white{fill:#fff}.small{font:600 13px Arial,sans-serif;fill:#577184;text-anchor:middle}.dot{fill:#78b93f;animation:blink 1.6s ease-in-out infinite}.d2{animation-delay:.8s}@keyframes dash{to{stroke-dashoffset:-70}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes pulse{50%{transform:scale(1.08)}}@keyframes blink{50%{opacity:.2}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="bg" width="720" height="520" rx="30"/><path class="line" d="M360 260L135 145M360 260L135 375M360 260L585 145M360 260L585 375"/><g class="pulse"><circle class="hub" cx="360" cy="260" r="87"/><circle cx="360" cy="238" r="25" fill="#78b93f"/><path d="M309 300c11-34 33-50 51-50s40 16 51 50" fill="#078fb9"/><text class="txt white" x="360" y="332">SourceTX Match</text></g><g class="float"><rect class="person" x="50" y="80" width="170" height="130" rx="20"/><circle cx="135" cy="120" r="23" fill="#078fb9"/><path d="M94 174c8-30 25-43 41-43s33 13 41 43" fill="#b9deea"/><text class="txt" x="135" y="197">Cloud Engineer</text></g><g class="float f2"><rect class="person green" x="50" y="310" width="170" height="130" rx="20"/><circle cx="135" cy="350" r="23" fill="#78b93f"/><path d="M94 404c8-30 25-43 41-43s33 13 41 43" fill="#dceecb"/><text class="txt" x="135" y="427">Data Leader</text></g><g class="float f3"><rect class="person green" x="500" y="80" width="170" height="130" rx="20"/><text class="txt" x="585" y="125">Client Team</text><rect x="538" y="145" width="94" height="12" rx="6" fill="#78b93f"/><rect x="548" y="168" width="74" height="12" rx="6" fill="#b3c3cc"/></g><g class="float f2"><rect class="person" x="500" y="310" width="170" height="130" rx="20"/><text class="txt" x="585" y="355">Delivery Team</text><circle cx="552" cy="392" r="16" fill="#078fb9"/><circle cx="585" cy="392" r="16" fill="#78b93f"/><circle cx="618" cy="392" r="16" fill="#10243b"/></g><circle class="dot" cx="248" cy="203" r="7"/><circle class="dot d2" cx="472" cy="203" r="7"/><circle class="dot" cx="248" cy="317" r="7"/><circle class="dot d2" cx="472" cy="317" r="7"/></svg>