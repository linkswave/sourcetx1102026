<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t d"><title id="t">Animated cloud transformation illustration</title><desc id="d">Data packets move from legacy systems through a cloud platform to modern applications.</desc><style>.bg{fill:#eaf6fa}.cloud{fill:#fff;stroke:#078fb9;stroke-width:6}.legacy{fill:#10243b}.modern{fill:#078fb9}.line{fill:none;stroke:#4b8ba7;stroke-width:4;stroke-dasharray:10 12;animation:dash 3s linear infinite}.packet{fill:#78b93f;animation:travel 4s ease-in-out infinite}.p2{animation-delay:1.25s}.p3{animation-delay:2.5s}.gear{transform-origin:512px 364px;animation:spin 7s linear infinite}.txt{font:700 18px Arial,sans-serif;fill:#10243b;text-anchor:middle}.small{font:600 14px Arial,sans-serif;fill:#526d7d;text-anchor:middle}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes travel{0%,10%{transform:translate(0,0);opacity:0}20%{opacity:1}50%{transform:translate(225px,-105px)}80%{opacity:1}90%,100%{transform:translate(450px,0);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="bg" width="720" height="520" rx="30"/><rect class="legacy" x="50" y="318" width="150" height="112" rx="16"/><rect x="70" y="341" width="110" height="15" rx="6" fill="#9fb2c0"/><rect x="70" y="370" width="80" height="15" rx="6" fill="#9fb2c0"/><rect x="70" y="399" width="95" height="15" rx="6" fill="#9fb2c0"/><text class="txt" x="125" y="465">Legacy</text><path class="line" d="M195 345C280 345 280 235 360 235S445 345 520 345"/><path class="cloud" d="M277 254c-42 0-70-28-70-64 0-34 25-61 58-64 14-56 62-91 118-82 39 6 72 34 85 70 48-4 87 33 87 79 0 43-34 76-79 76H277z"/><text class="txt" x="380" y="176">Cloud Platform</text><text class="small" x="380" y="201">Migrate · modernize · optimize</text><circle class="packet" cx="196" cy="345" r="10"/><circle class="packet p2" cx="196" cy="345" r="10"/><circle class="packet p3" cx="196" cy="345" r="10"/><rect class="modern" x="520" y="307" width="150" height="123" rx="18"/><rect x="542" y="329" width="106" height="64" rx="8" fill="#fff"/><path d="M552 378l24-25 18 16 25-30 19 39z" fill="#78b93f"/><g class="gear"><circle cx="512" cy="364" r="28" fill="#fff" stroke="#78b93f" stroke-width="7"/><circle cx="512" cy="364" r="9" fill="#78b93f"/><path d="M512 325v14M512 389v14M473 364h14M537 364h14M485 337l10 10M529 381l10 10M539 337l-10 10M495 381l-10 10" stroke="#78b93f" stroke-width="7"/></g><text class="txt" x="595" y="465">Modern Apps</text></svg>