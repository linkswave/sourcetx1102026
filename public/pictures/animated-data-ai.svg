<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t d"><title id="t">Animated data and AI illustration</title><desc id="d">Data sources stream into an intelligent analytics engine and dashboards.</desc><style>.bg{fill:#07192d}.pipe{fill:none;stroke:#2a6687;stroke-width:5;stroke-dasharray:8 10;animation:flow 3s linear infinite}.node{fill:#102f49;stroke:#078fb9;stroke-width:3}.green{stroke:#78b93f}.pulse{animation:pulse 2.5s ease-in-out infinite;transform-origin:center}.bar{fill:#078fb9;animation:grow 2.8s ease-in-out infinite;transform-origin:bottom}.b2{animation-delay:.4s}.b3{animation-delay:.8s}.dot{fill:#78b93f;animation:move 4s linear infinite}.d2{animation-delay:1.3s}.d3{animation-delay:2.6s}.txt{font:700 18px Arial,sans-serif;fill:#fff;text-anchor:middle}.small{font:600 14px Arial,sans-serif;fill:#bad2df;text-anchor:middle}@keyframes flow{to{stroke-dashoffset:-72}}@keyframes pulse{50%{transform:scale(1.07)}}@keyframes grow{50%{transform:scaleY(.48)}}@keyframes move{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(440px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="bg" width="720" height="520" rx="30"/><path class="pipe" d="M138 260H575"/><g><rect class="node" x="42" y="124" width="150" height="80" rx="18"/><text class="txt" x="117" y="160">Apps</text><text class="small" x="117" y="184">APIs &amp; events</text><rect class="node green" x="42" y="220" width="150" height="80" rx="18"/><text class="txt" x="117" y="256">Files</text><text class="small" x="117" y="280">Batch &amp; documents</text><rect class="node" x="42" y="316" width="150" height="80" rx="18"/><text class="txt" x="117" y="352">Databases</text><text class="small" x="117" y="376">Operational data</text></g><g class="pulse"><circle cx="360" cy="260" r="98" fill="#0c789e"/><circle cx="360" cy="260" r="73" fill="#102f49" stroke="#78b93f" stroke-width="4"/><path d="M327 263c16-49 61-49 70 0M335 232c-9-19 8-35 25-26M388 232c9-19-8-35-25-26M331 286c20 31 58 31 78 0" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><text class="txt" x="360" y="387">Intelligence Layer</text></g><g><rect class="node green" x="530" y="130" width="150" height="260" rx="20"/><text class="txt" x="605" y="166">Insights</text><rect class="bar" x="559" y="270" width="22" height="76" rx="5"/><rect class="bar b2" x="594" y="226" width="22" height="120" rx="5"/><rect class="bar b3" x="629" y="190" width="22" height="156" rx="5"/><path d="M555 211l46-34 45 20" fill="none" stroke="#fff" stroke-width="5"/><circle cx="555" cy="211" r="6" fill="#fff"/><circle cx="601" cy="177" r="6" fill="#fff"/><circle cx="646" cy="197" r="6" fill="#fff"/><text class="small" x="605" y="370">Predict · automate · act</text></g><circle class="dot" cx="145" cy="260" r="9"/><circle class="dot d2" cx="145" cy="260" r="9"/><circle class="dot d3" cx="145" cy="260" r="9"/></svg>